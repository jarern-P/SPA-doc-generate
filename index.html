<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Word Template Filler</title>

    <link rel="stylesheet" href="src/style.css">
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>

<body>

<div class="sidebar">
    <h3>เมนู</h3>
    <div class="menu-item active" data-page="report">📄 รายงาน</div>
    <div class="menu-item" data-page="master">⚙️ Master</div>
    <div class="submenu" id="masterSubmenu">
        <div class="menu-item" data-page="template-config">📋 Template Configuration</div>
    </div>
</div>

<div class="main" id="mainContent">
<h1>Word Template Filler</h1>

<div class="box">
    <input
        type="file"
        id="fileInput"
        accept=".docx"
    >
</div>

<div id="form"></div>

<button id="downloadBtn" style="display:none">
    Download DOCX
</button>
<button id="clearBtn" style="display:none">
    Clear
</button>
</div>

<script src="src/app.js"></script>

</body>
</html>
